schema: spec-driven

context: |
  See AGENTS.md for full project conventions. Summary:
  - Hexagonal architecture: domain / ports / adapters under lib/greeter/
  - Dependencies point inward only; domain must not reference adapters
  - All collaborators injected via constructor keyword arguments; no globals or singletons
  - TDD: failing RSpec example before implementation, same commit
  - Every OpenSpec spec scenario maps to exactly one Cucumber scenario tagged with the requirement name
  - Ruby 4.0.0, frozen_string_literal on every file, RuboCop clean

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

